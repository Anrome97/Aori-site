<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AORI | Arquitectura Esencial & tecnología BIM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AORI - Estudio de arquitectura esencial especializado en diseño contemporaneo y tecnología BIM">
  <link rel="icon" type="image/png" href="images/logo-aori.png?v=2">
  <link rel="apple-touch-icon" href="images/logo-aori.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .landing-hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.35);
      transform: scale(1.05);
      animation: heroZoom 20s ease-in-out infinite alternate;
    }

    @keyframes heroZoom {
      0% { transform: scale(1.05); }
      100% { transform: scale(1.12); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.5) 0%,
        rgba(0,0,0,0.2) 50%,
        rgba(0,0,0,0.4) 100%
      );
    }

    /* Top Bar */
    .top-bar { position: relative; z-index: 10; padding: 1.5rem 6rem; display: flex; justify-content: space-between; align-items: center; }

    .cta-btn {
      padding: 0.7rem 1.5rem;
      background: #C45A3C;
      color: #F7F5F2;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      background: #A84A32;
    }

    /* AORI Logo */
    .logo {
      font-family: 'Inter', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #C45A3C;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      z-index: 100;
    }

    .logo:hover {
      color: #A84A32;
    }

    /* Menu Toggle Button - Esquina Superior Derecha */
    .menu-toggle {
      position: fixed;
      top: 2rem;
      right: 3rem;
      z-index: 100;
      width: 50px;
      height: 50px;
      background: transparent;
      border: 1px solid rgba(247,245,242,0.3);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      padding: 0;
    }

    .menu-toggle:hover {
      border-color: #F7F5F2;
      background: rgba(247,245,242,0.1);
    }

    .menu-toggle span {
      width: 24px;
      height: 1.5px;
      background: #F7F5F2;
      transition: all 0.3s ease;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* Sidebar Menu */
    .sidebar {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100vh;
      background: rgba(10, 10, 10, 0.2);
      backdrop-filter: blur(20px);
      z-index: 1000;
      transition: right 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4rem;
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      width: 40px;
      height: 40px;
      background: transparent;
      border: 1px solid rgba(247,245,242,0.2);
      color: #F7F5F2;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .sidebar-close:hover {
      border-color: #C45A3C;
      color: #C45A3C;
    }

    .sidebar-nav {
      list-style: none;
    }

    .sidebar-nav li {
      margin-bottom: 0;
      opacity: 0;
      transform: translateX(30px);
      transition: all 0.4s ease;
    }

    .sidebar.active .sidebar-nav li {
      opacity: 1;
      transform: translateX(0);
    }

    .sidebar.active .sidebar-nav li:nth-child(1) { transition-delay: 0.1s; }
    .sidebar.active .sidebar-nav li:nth-child(2) { transition-delay: 0.15s; }
    .sidebar.active .sidebar-nav li:nth-child(3) { transition-delay: 0.2s; }
    .sidebar.active .sidebar-nav li:nth-child(4) { transition-delay: 0.25s; }
    .sidebar.active .sidebar-nav li:nth-child(5) { transition-delay: 0.3s; }
    .sidebar.active .sidebar-nav li:nth-child(6) { transition-delay: 0.35s; }

    .sidebar-nav a {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.7rem;
      color: rgba(247,245,242,0.7);
      text-decoration: none;
      display: block;
      padding: 0.8rem 0;
      transition: all 0.3s ease;
    }

    .sidebar-nav a:hover {
      color: #F7F5F2;
      padding-left: 1rem;
    }


    /* Overlay */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Center Content */
    .hero-center {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 2rem;
    }

    .featured-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(247,245,242,0.5);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .featured-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 400;
      font-style: italic;
      color: #F7F5F2;
      line-height: 1.1;
      margin-bottom: 1rem;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .featured-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      font-weight: 300;
      color: rgba(247,245,242,0.6);
      letter-spacing: 0.1em;
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.8s ease-out 0.6s both;
    }

    .btn-view {
      display: inline-block;
      padding: 1rem 3rem;
      border: 1px solid rgba(247,245,242,0.5);
      color: #F7F5F2;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s ease-out 0.8s both;
    }

    .btn-view::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: #F7F5F2;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: -1;
    }

    .btn-view:hover {
      color: #1E1E1E;
      border-color: #F7F5F2;
    }

    .btn-view:hover::before {
      left: 0;
    }

    /* Bottom Right Tagline */
    .bottom-center {
      position: absolute;
      bottom: 0;
      right: 2rem;
      z-index: 10;
      text-align: right;
      animation: fadeInUp 0.8s ease-out 1s both;
    }

    .bottom-center .tagline {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-style: normal;
      font-weight: 700;
      color: #F7F5F2;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      writing-mode: horizontal-tb;
    }

    /* Social Links - Vertical Left Center */
    .social-vertical {
      position: absolute;
      top: 50%;
      left: 3rem;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      animation: fadeInUp 0.8s ease-out 1.2s both;
    }

    .social-vertical a {
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      color: rgba(247,245,242,0.5);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      writing-mode: vertical-rl;
      transition: all 0.3s ease;
    }

    .social-vertical a:hover {
      color: #C45A3C;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        padding: 1.5rem;
      }
      
      .menu-toggle {
        right: 1.5rem;
      }
      
      .sidebar {
        width: 100%;
        right: -100%;
        padding: 3rem 2rem;
      }
      
      .sidebar-nav a {
        font-size: 1.5rem;
      }
      
      .social-vertical {
        left: 1.5rem;
      }
      
      .scroll-indicator {
        right: 1.5rem;
      }
      
      .featured-title {
        font-size: clamp(2rem, 10vw, 4rem);
      }
      
      .bottom-center {
        bottom: 1.5rem;
        right: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-transition"></div>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar Menu -->
  <nav class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose">&times;</button>
    <ul class="sidebar-nav">
      <li><a href="sobre-nosotros/index.html">Nosotros</a></li>
      <li><a href="projects/index.html">Proyectos</a></li>
      <li><a href="metodologia/index.html">Metodología</a></li>
      <li><a href="cotiza/index.html">Cotiza tu Proyecto</a></li>
      <li><a href="contacto/index.html">Contacto</a></li>
    </ul>
  </nav>

  <!-- Landing Hero -->
  <section class="landing-hero">
    <img 
      src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1920&q=80" 
      alt="Arquitectura esencial" 
      class="hero-bg"
      onerror="this.style.background='linear-gradient(135deg, #1E1E1E, #2a2a2a)'; this.style.display='none';"
    >
    <div class="hero-overlay"></div>

    <!-- Top Bar -->
    <nav class="top-bar">
      <a href="index.html" class="logo">AORI</a>
      <button class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>

    <!-- Center - Featured Project -->
    <div class="hero-center">
      <span class="featured-label">Proyecto del Mes</span>
      <h1 class="featured-title">Residencia Horizon</h1>
      <a href="projects/proyecto1/index.html" class="btn-view">Ver Proyecto</a>
    </div>

    <!-- Bottom Center Tagline -->
    <div class="bottom-center">
      <p class="tagline">AORI | Arquitectura Esencial & tecnología BIM</p>
    </div>

    <!-- Social Links - Vertical Left -->
    <div class="social-vertical">
      <a href="https://www.instagram.com/aoriestudio/?hl=es" target="_blank" rel="noopener">IG</a>
      <a href="#">IN</a>
    </div>

  </section>

  <script src="js/main.js"></script>
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarClose = document.getElementById('sidebarClose');

    function openSidebar() {
      menuToggle.classList.add('active');
      sidebar.classList.add('active');
      sidebarOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeSidebar() {
      menuToggle.classList.remove('active');
      sidebar.classList.remove('active');
      sidebarOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    menuToggle.addEventListener('click', function() {
      if (sidebar.classList.contains('active')) {
        closeSidebar();
      } else {
        openSidebar();
      }
    });

    sidebarClose.addEventListener('click', closeSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeSidebar();
    });
  </script>
</body>
</html>
